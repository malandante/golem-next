name: release

# Builds the SD package on every push (artifact) and, for a v* tag, publishes
# it as a GitHub release with the notes of RELEASE_NOTES.md.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sjasmplus
        run: |
          git clone --depth 1 --branch v1.24.0 https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j4 USE_LUA=0
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build the SD package
        run: python3 tools/release/build_release.py --assembler-path /tmp/sjasmplus/sjasmplus --version "${{ steps.version.outputs.version }}" --firmware https://github.com/malandante/mt32-pi/releases --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: golem-next-${{ steps.version.outputs.version }}
          path: dist/golem-next-*.zip
      - name: Release notes for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1} p' RELEASE_NOTES.md > notes.md
          test -s notes.md
          { echo; echo '### SHA256SUMS'; echo '```'; cat "dist/golem-next-$v/SHA256SUMS"; (cd dist && sha256sum "golem-next-$v.zip"); echo '```'; } >> notes.md
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/golem-next-${{ steps.version.outputs.version }}.zip" --title "golem-next ${{ steps.version.outputs.version }}" --notes-file notes.md
