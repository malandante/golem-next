name: host-tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Host tests
        run: python -m unittest discover -s tests/host -v
      - name: Host tools run with isolated sys.path (NextBuild embedded Python)
        run: |
          python -I tools/host/golem_responder.py --help > /dev/null
          python -I tools/host/capture_uart.py --help > /dev/null

  driver-relocations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sjasmplus
        run: |
          git clone --depth 1 --branch v1.24.0 https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j4 USE_LUA=0
      - name: No symbols that differ only in case (SNasm ignores case)
        run: python3 tools/ci/check_symbol_case.py
      - name: Relocation table matches the code (#18)
        run: python3 tools/ci/check_driver_relocations.py --sjasmplus /tmp/sjasmplus/sjasmplus
      - name: SET_OUTPUT in a Z80 simulator (#64)
        run: |
          git clone --depth 1 https://github.com/skoolkid/skoolkit.git /tmp/skoolkit
          python3 tools/ci/test_driver_output.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: .golem note lasts real seconds with 48K and +3 timing, in every video timing (#92)
        run: python3 tools/ci/test_note_duration.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit --seconds 2
      - name: .golem usb and reset parse and send the right bytes (#85, #104)
        run: python3 tools/ci/test_golem_usb.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: after SPACE cancels, the cleanup sweep reaches all 16 channels
        run: python3 tools/ci/test_golem_cancel.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: .golem set parses, sends SET_PARAM and prints the reply; one-line usage
        run: python3 tools/ci/test_golem_set.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: .GOLEM work bank layout
        run: python3 tools/ci/check_golem_layout.py --sjasmplus /tmp/sjasmplus/sjasmplus
      - name: .gsq keeps real milliseconds in every video timing (HDMI, VGA 0-6)
        run: python3 tools/ci/test_gsq_clock.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: MIDI input library gives whole messages and drops Golem replies
        run: python3 tools/ci/test_midiin.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: examples/midimon.bas builds with ZX Basic and prints the messages (binding + library)
        run: |
          git clone --depth 1 --branch v1.18.7 https://github.com/boriel-basic/zxbasic.git /tmp/zxbasic
          python3 tools/ci/test_midimon.py --zxbc /tmp/zxbasic/zxbc.py --skoolkit /tmp/skoolkit
      - name: .MIDIMON shows the messages, frees its bank and restores the machine
        run: python3 tools/ci/test_midimon_dot.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: Sound-parameter library (gp_*) against a model of the Golem, both buffer sizes
        run: python3 tools/ci/test_gparam.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: gp_* library banks assemble and fit in 8 KB
        run: python3 tools/ci/check_gparam_banks.py --sjasmplus /tmp/sjasmplus/sjasmplus
      - name: ZX Basic binding of gp_* (src/lib/gparam.bas) with the library bank
        run: python3 tools/ci/test_gparam_bas.py --zxbc /tmp/zxbasic/zxbc.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: GSEQ long messages (gs_send_long), also with gp_* sending through GSEQ
        run: python3 tools/ci/test_gseq_long.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: .GPARAM info, get, set, put and save, and it restores the machine
        run: python3 tools/ci/test_gparam_dot.py --sjasmplus /tmp/sjasmplus/sjasmplus --skoolkit /tmp/skoolkit
      - name: GSEQ library banks assemble and fit in 8 KB
        run: python3 tools/ci/check_gseq_banks.py --sjasmplus /tmp/sjasmplus/sjasmplus
